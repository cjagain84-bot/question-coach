<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>질문 만들기 탐구 코치</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" />
  <style>
    :root {
      --font-sans: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    .container { max-width: 820px; margin: 32px auto; padding: 0 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }
    h1 { font-size: 1.45rem; margin: 0 0 8px; font-weight: 700; }
    h2 { font-size: 1.15rem; margin: 0 0 14px; font-weight: 700; }
    p.sub { margin: 0 0 20px; color: var(--muted); font-size: 0.95rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; }
    input, select, textarea {
      width: 100%;
      font-family: var(--font-sans);
      font-size: 0.96rem;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
    .btn {
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 0.96rem;
      padding: 11px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
    }
    .btn:hover:not(:disabled) { background: var(--primary-dark); }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-secondary { background: #0f766e; }
    .btn-secondary:hover:not(:disabled) { background: #115e59; }
    .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .type-card {
      text-align: left;
      padding: 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all 0.15s;
    }
    .type-card:hover { border-color: var(--primary); background: #eff6ff; }
    .type-card strong { display: block; font-size: 1rem; margin-bottom: 4px; color: var(--text); }
    .type-card span { font-size: 0.86rem; color: var(--muted); }
    .status-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #f1f5f9;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-bottom: 14px;
    }
    .badge {
      background: #dbeafe;
      color: #1e40af;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
    }
    .chat-box {
      height: 360px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      background: #fcfcfd;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }
    .msg.user { align-self: flex-end; background: var(--primary); color: #fff; }
    .msg.assistant { align-self: flex-start; background: #eef2ff; color: var(--text); border: 1px solid #c7d2fe; }
    .msg.system-note { align-self: center; background: #fef3c7; color: #92400e; font-size: 0.86rem; }
    .input-row { display: flex; gap: 8px; margin-bottom: 18px; }
    .input-row input { flex: 1; }
    .final-box { border-top: 1px dashed var(--border); padding-top: 16px; margin-top: 8px; }
    .hidden { display: none; }
    @media (max-width: 600px) { .grid-2, .type-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <div id="step-1" class="card">
      <h1>질문 만들기 탐구 코치</h1>
      <p class="sub">인쇄물 글과 수업을 바탕으로 나만의 질문을 만들어 봅시다. (최대 10회 힌트 대화 가능)</p>

      <div class="grid-2">
        <div>
          <label for="className">학급</label>
          <input id="className" type="text" placeholder="예: 2학년 3반" />
        </div>
        <div>
          <label for="topicSelect">주제(글 제목) 선택</label>
          <select id="topicSelect">
            <option value="">-- 시트에서 주제 불러오는 중 --</option>
          </select>
        </div>
      </div>

      <div id="customTopicWrap" class="hidden" style="margin-bottom: 14px;">
        <label for="customTopic">주제(글 제목) 직접 입력</label>
        <input id="customTopic" type="text" placeholder="인쇄물에 적힌 글 제목을 입력하세요" />
      </div>

      <div class="grid-2">
        <div>
          <label for="studentId">학번</label>
          <input id="studentId" type="text" placeholder="예: 20315" />
        </div>
        <div>
          <label for="studentName">이름</label>
          <input id="studentName" type="text" placeholder="예: 김민준" />
        </div>
      </div>

      <button id="toStep2Btn" class="btn" type="button">다음: 질문 유형 선택하기</button>
    </div>

    <div id="step-2" class="card hidden">
      <h2>어떤 유형의 질문을 만들어 볼까요?</h2>
      <p class="sub">선택한 유형에 맞는 사고 힌트를 드립니다. 완성된 질문 대신 생각의 실마리를 찾아보세요.</p>

      <div class="type-grid">
        <button type="button" class="type-card" data-type="읽기 전 질문">
          <strong>1. 읽기 전 질문</strong>
          <span>제목·시각 자료·배경지식을 바탕으로 궁금한 점 예측하기</span>
        </button>
        <button type="button" class="type-card" data-type="읽기 후 이해·확장 질문">
          <strong>2. 읽기 후 이해·확장 질문</strong>
          <span>사실 확인, 숨은 이유 추론, 다른 상황에 비유해 확장하기</span>
        </button>
        <button type="button" class="type-card" data-type="토론용 질문">
          <strong>3. 토론용 질문</strong>
          <span>주장의 근거를 따지고 반대 입장·쟁점을 끌어내는 질문</span>
        </button>
        <button type="button" class="type-card" data-type="글쓰기용 질문">
          <strong>4. 글쓰기용 질문</strong>
          <span>나만의 글감을 찾고 중심 생각·독자 관점을 구체화하기</span>
        </button>
      </div>
    </div>

    <div id="step-3" class="card hidden">
      <div class="status-bar">
        <span id="sessionSummary"></span>
        <span id="turnBadge" class="badge">대화 기회: 0 / 10회</span>
      </div>

      <div id="chatBox" class="chat-box"></div>

      <div class="input-row">
        <input id="userInput" type="text" placeholder="궁금한 점이나 내가 만든 질문 초안을 적어 보세요..." />
        <button id="sendBtn" class="btn" type="button">힌트 요청</button>
      </div>

      <div class="final-box">
        <label for="finalQuestion">내가 완성한 최종 질문 (제출 전 직접 다듬어 적어 주세요)</label>
        <textarea id="finalQuestion" rows="2" placeholder="힌트를 바탕으로 내가 만든 최종 질문 한 문장을 입력하세요."></textarea>
        <div style="margin-top: 10px; display: flex; justify-content: space-between; align-items: center;">
          <span id="syncStatus" style="font-size: 0.85rem; color: var(--muted);">* 5회·10회 대화 시 자동 임시저장됩니다.</span>
          <button id="submitFinalBtn" class="btn btn-secondary" type="button">최종 질문 제출하기</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/YOUR_DEPLOYED_GAS_ID/exec';
    const AI_API_ENDPOINT = '/api/coach';
    const MAX_TURNS = 10;

    let loadedTopics = [];
    const state = {
      sessionId: '',
      inputDate: '',
      className: '',
      topic: '',
      teacherTopicHints: '',
      studentId: '',
      studentName: '',
      questionType: '',
      turnCount: 0,
      messages: [],
      finalQuestion: '',
      isSubmitted: false
    };

    function getTodayKST() {
      const now = new Date();
      const kst = new Date(now.getTime() + 9 * 60 * 60 * 1000);
      return kst.toISOString().slice(0, 10);
    }

    function createSessionId() {
      return 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    }

    async function initTopics() {
      const selectEl = document.getElementById('topicSelect');
      try {
        const res = await fetch(GAS_WEBAPP_URL, { method: 'GET' });
        const data = await res.json();
        if (data.status === 'ok' && Array.isArray(data.topics)) {
          loadedTopics = data.topics;
        }
      } catch (err) {
        console.warn('주제 목록 로드 실패:', err);
      }

      selectEl.innerHTML = '<option value="">-- 주제를 선택하세요 --</option>';
      loadedTopics.forEach((item) => {
        const opt = document.createElement('option');
        opt.value = item.topic;
        opt.textContent = item.topic;
        selectEl.appendChild(opt);
      });
      const customOpt = document.createElement('option');
      customOpt.value = '__CUSTOM__';
      customOpt.textContent = '직접 주제 입력하기';
      selectEl.appendChild(customOpt);
    }

    document.getElementById('topicSelect').addEventListener('change', (e) => {
      document.getElementById('customTopicWrap').classList.toggle('hidden', e.target.value !== '__CUSTOM__');
    });

    document.getElementById('toStep2Btn').addEventListener('click', () => {
      const className = document.getElementById('className').value.trim();
      const selectedVal = document.getElementById('topicSelect').value;
      const customVal = document.getElementById('customTopic').value.trim();
      const studentId = document.getElementById('studentId').value.trim();
      const studentName = document.getElementById('studentName').value.trim();
      const topic = selectedVal === '__CUSTOM__' ? customVal : selectedVal;

      if (!className || !topic || !studentId || !studentName) {
        alert('학급, 주제, 학번, 이름을 모두 입력해 주세요.');
        return;
      }

      const matched = loadedTopics.find((t) => t.topic === topic);
      state.sessionId = createSessionId();
      state.inputDate = getTodayKST();
      state.className = className;
      state.topic = topic;
      state.teacherTopicHints = matched ? matched.teacherTopicHints : '';
      state.studentId = studentId;
      state.studentName = studentName;

      document.getElementById('step-1').classList.add('hidden');
      document.getElementById('step-2').classList.remove('hidden');
    });

    document.querySelectorAll('.type-card').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.questionType = btn.dataset.type;
        document.getElementById('step-2').classList.add('hidden');
        document.getElementById('step-3').classList.remove('hidden');

        document.getElementById('sessionSummary').textContent =
          `${state.className} | ${state.topic} | ${state.studentId} ${state.studentName} | [${state.questionType}]`;

        appendMessage(
          'assistant',
          `[${state.questionType}] 모드를 선택했어요. 인쇄물 글 "${state.topic}"을(를) 보면서 떠오른 생각이나 만들어 본 질문 초안을 적어 주세요. 완성된 질문 대신 스스로 질문을 만들 수 있도록 힌트를 드릴게요!`
        );
      });
    });

    function appendMessage(role, text) {
      const box = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function updateTurnUI() {
      document.getElementById('turnBadge').textContent = `대화 기회: ${state.turnCount} / ${MAX_TURNS}회`;
      if (state.turnCount >= MAX_TURNS) {
        document.getElementById('userInput').disabled = true;
        document.getElementById('sendBtn').disabled = true;
        document.getElementById('userInput').placeholder = '10회 대화를 모두 사용했습니다. 아래에 최종 질문을 정리해 제출해 주세요.';
        appendMessage('system-note', '질문 코칭 기회 10회를 모두 사용했습니다. 아래 입력칸에 나만의 최종 질문을 완성해 제출해 주세요.');
      }
    }

    async function syncToGoogleSheet(isFinalSubmit = false) {
      const shouldSync = isFinalSubmit || (state.turnCount > 0 && state.turnCount % 5 === 0);
      if (!shouldSync) return;

      const syncEl = document.getElementById('syncStatus');
      syncEl.textContent = '시트에 저장 중...';

      const payload = {
        sessionId: state.sessionId,
        inputDate: state.inputDate,
        className: state.className,
        topic: state.topic,
        studentId: state.studentId,
        studentName: state.studentName,
        questionType: state.questionType,
        turnCount: state.turnCount,
        finalQuestion: document.getElementById('finalQuestion').value.trim(),
        conversationLog: state.messages
      };

      try {
        await fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        syncEl.textContent = isFinalSubmit
          ? '최종 질문과 전체 대화 내역이 시트에 저장되었습니다.'
          : `${state.turnCount}회차 대화 내역이 시트에 자동 임시저장되었습니다.`;
      } catch (err) {
        syncEl.textContent = '시트 저장 중 오류가 발생했습니다. 네트워크를 확인해 주세요.';
      }
    }

    async function handleSendMessage() {
      if (state.turnCount >= MAX_TURNS) return;
      const inputEl = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      inputEl.disabled = true;
      sendBtn.disabled = true;

      state.turnCount += 1;
      state.messages.push({ role: 'user', content: text });
      appendMessage('user', text);
      updateTurnUI();

      try {
        const res = await fetch(AI_API_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            className: state.className,
            topic: state.topic,
            questionType: state.questionType,
            turnCount: state.turnCount,
            teacherTopicHints: state.teacherTopicHints,
            messages: state.messages
          })
        });

        const data = await res.json();
        const reply = data.reply || '힌트를 생성하지 못했습니다. 다시 한 번 입력해 주세요.';
        state.messages.push({ role: 'assistant', content: reply });
        appendMessage('assistant', reply);

        await syncToGoogleSheet(false);
      } catch (err) {
        appendMessage('system-note', 'AI 응답을 불러오는 중 오류가 발생했습니다.');
      } finally {
        if (state.turnCount < MAX_TURNS && !state.isSubmitted) {
          inputEl.disabled = false;
          sendBtn.disabled = false;
          inputEl.focus();
        }
      }
    }

    document.getElementById('sendBtn').addEventListener('click', handleSendMessage);
    document.getElementById('userInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing) handleSendMessage();
    });

    document.getElementById('submitFinalBtn').addEventListener('click', async () => {
      const finalQ = document.getElementById('finalQuestion').value.trim();
      if (!finalQ) {
        alert('제출할 최종 질문을 먼저 작성해 주세요.');
        return;
      }
      state.finalQuestion = finalQ;
      state.isSubmitted = true;

      document.getElementById('userInput').disabled = true;
      document.getElementById('sendBtn').disabled = true;
      document.getElementById('finalQuestion').disabled = true;
      document.getElementById('submitFinalBtn').disabled = true;

      await syncToGoogleSheet(true);
      alert('최종 질문이 성공적으로 제출되었습니다!');
    });

    initTopics();
  </script>
</body>
</html>
